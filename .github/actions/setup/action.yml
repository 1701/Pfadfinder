name: Setup
description: Node from .nvmrc and cached node_modules. The E2E jobs run in the Playwright image.

runs:
  using: composite
  steps:
    # In the Playwright image the job runs as root on a checkout owned by the runner user, and
    # actions/checkout marks it safe only for its own step: git (npm's prepare script, the
    # screenshot diff) would stop with "not in a git directory" (run 39910965609).
    - name: Mark the checkout as safe for git
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    # node_modules itself, not only the npm cache: a hit skips `npm ci` entirely.
    - name: Cache node_modules
      id: node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
    - if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
