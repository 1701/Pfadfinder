name: Setup
description: Node from .nvmrc, cached node_modules and, if asked, cached Playwright browsers.

inputs:
  browser:
    description: Playwright browser to install (chromium or webkit); empty for none.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    # node_modules itself, not only the npm cache: a hit skips `npm ci` entirely.
    - name: Cache node_modules
      id: node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
    - if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - name: Playwright version
      id: playwright
      if: inputs.browser != ''
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: browsers
      if: inputs.browser != ''
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browser }}
    # The system libraries (apt) are not cached; a hit only skips the browser download.
    # A slow apt mirror once took 9 min. Composite steps have no timeout-minutes, so `timeout`
    # ends an attempt after 4 min and one retry follows; the workflows set timeout-minutes on the
    # step that uses this action. `timeout` cannot end apt-get, which runs as root under sudo, and
    # its dpkg lock failed the retry at once (run 39866922436). So apt-get is ended first and the
    # retry waits up to 60 s for the lock.
    - name: Install browser
      if: inputs.browser != ''
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        HIT: ${{ steps.browsers.outputs.cache-hit }}
      run: |
        if [ "$HIT" = true ]; then install=(npx playwright install-deps "$BROWSER")
        else install=(npx playwright install --with-deps "$BROWSER"); fi
        for attempt in 1 2; do
          if timeout -k 30s 4m "${install[@]}"; then exit 0; fi
          echo "::warning::Browser install attempt $attempt failed or took longer than 4 min"
          sudo pkill apt-get || true
          for _ in $(seq 60); do
            sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1 || break
            sleep 1
          done
          sudo dpkg --configure -a || true
        done
        exit 1
