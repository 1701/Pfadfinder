name: Layout

# The layout project (every item, Probetest and reading text in four viewports, ~40 min on the
# 2-vCPU runner). Only by hand while the repo is private (Actions minutes are billed); the
# layout project runs locally before UI and content commits (CLAUDE.md, DoD 1). Once the repo
# is public, re-enable the nightly run (schedule: cron '0 1 * * *', docs/DEPLOY.md §9).
#   gh workflow run layout.yml --ref main
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    # The same Playwright image as the E2E jobs in ci.yml (exact version from package-lock.json).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 60
    env:
      PLAYWRIGHT_JSON_OUTPUT_FILE: tests/e2e/output/report.json
    steps:
      - name: Screenshot switch is never set in CI
        run: test "${PFADFINDER_UPDATE_SCREENSHOTS:-}" = ""
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: E2E layout project
        run: npx playwright test --project=layout --reporter=dot,json
      - name: Versioned screenshots untouched
        run: git diff --exit-code --stat -- tests/e2e/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output-layout
          path: tests/e2e/output
