name: CI

# Every push: check (lint, content, unit tests, build) and the Chromium and WebKit smoke
# projects, as three parallel jobs. The layout project (~23 min) runs in layout.yml, nightly
# and by hand. Docs, Markdown, versioned screenshots and layout.yml start no run at all.
on:
  push:
    branches: [main, master, su]
    paths-ignore: ['docs/**', '**/*.md', 'tests/e2e/screenshots/**', '.github/workflows/layout.yml']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'tests/e2e/screenshots/**', '.github/workflows/layout.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint
        run: npm run lint
      - name: Validate content
        run: npm run content:validate
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  # The Playwright config builds and previews dist itself (webServer), so no dist artifact.
  # Both E2E jobs run in the Playwright image of the exact @playwright/test version in
  # package-lock.json: browsers and their system libraries come with it, no apt (a slow mirror
  # failed the install in runs 39866922436, 39871704554 and 39907709670). Update the tag with
  # every Playwright update.
  smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    env:
      PLAYWRIGHT_JSON_OUTPUT_FILE: tests/e2e/output/report.json
    steps:
      - name: Screenshot switch is never set in CI
        run: test "${PFADFINDER_UPDATE_SCREENSHOTS:-}" = ""
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: E2E Chromium (iPad landscape and portrait)
        run: npx playwright test --project=chromium-landscape --project=chromium-portrait --reporter=dot,json
      - name: Versioned screenshots untouched
        run: git diff --exit-code --stat -- tests/e2e/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: tests/e2e/output

  # Playwright ships WebKit's system libraries only for Ubuntu/Debian; the iPad target needs it.
  webkit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    env:
      PLAYWRIGHT_JSON_OUTPUT_FILE: tests/e2e/output/report.json
    steps:
      - name: Screenshot switch is never set in CI
        run: test "${PFADFINDER_UPDATE_SCREENSHOTS:-}" = ""
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: E2E WebKit (iPad landscape and portrait)
        run: npx playwright test --project=webkit-landscape --project=webkit-portrait --reporter=dot,json
      - name: Versioned screenshots untouched
        run: git diff --exit-code --stat -- tests/e2e/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output-webkit
          path: tests/e2e/output
