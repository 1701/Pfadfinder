<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kostenlose Übungen zur Vorbereitung auf Kompass 4" />
    <title>Pfadfinder</title>
    <!-- Icons from public/icon.svg (npm run icons). iOS ignores the manifest icons and uses the
         apple-touch-icon: 180×180, no alpha, iOS rounds the corners itself. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#163a2f" />
    <meta name="apple-mobile-web-app-title" content="Pfadfinder" />
    <!-- Static shell until the JS runs: paper, ink and Andika instead of a white screen. React
         replaces the content of #root on its first render. Colours = --color-paper and
         --color-ink in src/ui/theme/tokens.css (tests/ui/tokens.test.ts). -->
    <link
      rel="preload"
      href="/fonts/andika/Andika-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Andika';
        src: url('/fonts/andika/Andika-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        background: #eef3f1;
        color: #163a2f;
      }
      .shell {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        font-family: 'Andika', 'Trebuchet MS', system-ui, sans-serif;
        font-size: 40px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="root"><p class="shell">Pfadfinder</p></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
